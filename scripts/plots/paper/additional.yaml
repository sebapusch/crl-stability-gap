  - title: "DDPG + JI"
    smooth: 15
    linewidth: 1.6
    timesteps: 75_000
    zooms:
      - t_start: 70_000
        t_end: 85_000
      - t_start: 145_000
        t_end: 160_000

    lines:
      - method: "ddpg_ip_ji/ddpg_ip_ji-s_<s>-l_000025"
        envs: [ V1, V2, V3 ]
        test_env: V1
        label: "$\\mathcal{B}_{\\text{easy}}$"
        color: "#9E2C01"

      - method: "ddpg_ip_ji_v2/ddpg_ip_ji-l_000025-s_<s>"
        envs: [ V2, V8, V9 ]
        test_env: V2
        label: "$\\mathcal{B}_{\\text{hard}}$"
        color: "#22B1E2"

